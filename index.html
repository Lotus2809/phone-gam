<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mystery Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

    <!-- LOCK SCREEN -->
    <div class="screen lock-screen" id="lockScreen">

        <div class="status-bar">
            <span>TM</span>
            <span>▮▮▮ WiFi 🔋</span>
        </div>

        <div class="lock-content">

            <p class="weather">Sun ☀ 78°</p>

            <h1 class="time">2:43</h1>

            <p class="day">SUNDAY</p>

            <p class="date">February 2, 2025</p>

        </div>

        <div class="bottom-buttons">

            <button class="round-button">🔦</button>

            <button class="round-button">📷</button>

        </div>

        <p class="swipe-text">
            Tap to unlock
        </p>

    </div>


    <!-- PASSCODE SCREEN -->
    <div class="screen passcode-screen hidden" id="passcodeScreen">

        <div class="status-bar">
            <span>TM</span>
            <span>▮▮▮ WiFi 🔋</span>
        </div>

        <div class="passcode-content">

            <div class="lock-icon">🔒</div>

            <h2>Enter Passcode</h2>

            <div class="passcode-dots">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

            <div class="keypad">

                <button class="number" data-number="1">1</button>
                <button class="number" data-number="2">2</button>
                <button class="number" data-number="3">3</button>

                <button class="number" data-number="4">4</button>
                <button class="number" data-number="5">5</button>
                <button class="number" data-number="6">6</button>

                <button class="number" data-number="7">7</button>
                <button class="number" data-number="8">8</button>
                <button class="number" data-number="9">9</button>

                <div></div>

                <button class="number" data-number="0">0</button>

                <button id="deleteButton">⌫</button>

            </div>

        </div>

    </div>


    <!-- HOME SCREEN -->
    <div class="screen home-screen hidden" id="homeScreen">

        <div class="status-bar home-status">
            <span>TM</span>
            <span>▮▮▮ WiFi 🔋</span>
        </div>

        <div class="apps">

            <button class="app" id="messagesApp">

                <div class="app-icon messages-icon">
                    💬
                </div>

                <span class="badge" id="messageBadge">1</span>

                <p>Messages</p>

            </button>

        </div>

    </div>


    <!-- MESSAGES LIST -->
    <div class="screen messages-screen hidden" id="messagesScreen">

        <div class="messages-top">

            <button class="nav-back" id="messagesBack">
                ‹
            </button>

            <div>
                <h2>Messages</h2>
                <p>Adrien's phone</p>
            </div>

        </div>


        <div class="conversation-list">

            <button class="conversation unread" data-chat="unknown">

                <div class="contact-avatar">?</div>

                <div class="conversation-info">

                    <div class="conversation-title">

                        <strong>Unknown</strong>

                        <span>19:15</span>

                    </div>

                    <p id="unknownPreview">
                        You still on for the 25th?
                    </p>

                </div>

            </button>


            <button class="conversation" data-chat="emma">

                <div class="contact-avatar">E</div>

                <div class="conversation-info">

                    <div class="conversation-title">

                        <strong>Emma</strong>

                        <span>Sep 16</span>

                    </div>

                    <p>
                        5 missed calls · 2 video calls
                    </p>

                </div>

            </button>


            <button class="conversation" data-chat="auntie">

                <div class="contact-avatar">A</div>

                <div class="conversation-info">

                    <div class="conversation-title">

                        <strong>Auntie</strong>

                        <span>Sep 15</span>

                    </div>

                    <p>
                        Adrien where are you?
                    </p>

                </div>

            </button>


            <button class="conversation" data-chat="ced">

                <div class="contact-avatar">C</div>

                <div class="conversation-info">

                    <div class="conversation-title">

                        <strong>CED</strong>

                        <span>Sep 15</span>

                    </div>

                    <p>
                        Did they do something to you?
                    </p>

                </div>

            </button>


            <button class="conversation" data-chat="timmy">

                <div class="contact-avatar">T</div>

                <div class="conversation-info">

                    <div class="conversation-title">

                        <strong>Timmy</strong>

                        <span>Aug 25</span>

                    </div>

                    <p>
                        Use the other phone
                    </p>

                </div>

            </button>

        </div>

    </div>


    <!-- CHAT SCREEN -->
    <div class="screen chat-screen hidden" id="chatScreen">

        <div class="chat-top">

            <button class="nav-back" id="chatBack">
                ‹
            </button>

            <div class="chat-avatar" id="chatAvatar">
                ?
            </div>

            <div>

                <h3 id="chatName">
                    Unknown
                </h3>

                <p id="chatStatus"></p>

            </div>

        </div>


        <div class="chat-messages" id="chatMessages"></div>


        <!-- ONLY USED FOR UNKNOWN -->
        <div class="unknown-response hidden" id="unknownResponse">

            <button id="replyUnknown">
                Who is this?
            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
