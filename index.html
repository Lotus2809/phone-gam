<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mystery Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

    <!-- =========================
         LOCK SCREEN
    ========================== -->

    <div class="screen lock-screen" id="lockScreen">

        <div class="status-bar">
            <span>TM</span>
            <span>▮▮▮ WiFi 🔋</span>
        </div>

        <div class="lock-content">

            <p class="weather">Thu ☀ 78°</p>

            <h1 class="time">7:12</h1>

            <p class="day">THURSDAY</p>

            <p class="date">September 24, 2026</p>

        </div>

        <div class="bottom-buttons">

            <button class="round-button">🔦</button>

            <button class="round-button">📷</button>

        </div>

        <p class="swipe-text">
            Tap to unlock
        </p>

    </div>


    <!-- =========================
         PASSCODE SCREEN
    ========================== -->

    <div class="screen passcode-screen hidden" id="passcodeScreen">

        <div class="status-bar">
            <span>TM</span>
            <span>▮▮▮ WiFi 🔋</span>
        </div>

        <div class="passcode-content">

            <div class="lock-icon">🔒</div>

            <h2>Enter Passcode</h2>

            <div class="passcode-dots">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>


            <div class="keypad">

                <button class="number" data-number="1">1</button>
                <button class="number" data-number="2">2</button>
                <button class="number" data-number="3">3</button>

                <button class="number" data-number="4">4</button>
                <button class="number" data-number="5">5</button>
                <button class="number" data-number="6">6</button>

                <button class="number" data-number="7">7</button>
                <button class="number" data-number="8">8</button>
                <button class="number" data-number="9">9</button>

                <div></div>

                <button class="number" data-number="0">0</button>

                <button id="deleteButton">
                    ⌫
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         HOME SCREEN
    ========================== -->

    <div class="screen home-screen hidden" id="homeScreen">

        <div class="status-bar">
            <span>7:12</span>
            <span>▮▮▮ WiFi 🔋</span>
        </div>

        <p class="home-date">
            THURSDAY · SEPTEMBER 24
        </p>


        <div class="app-grid">

            <button class="app-button" id="openMessagesButton">

                <div class="app-icon messages-app">
                    💬
                </div>

                <span class="notification-badge" id="messageBadge">
                    1
                </span>

                <span class="app-name">
                    Messages
                </span>

            </button>


            <button class="app-button disabled-app">

                <div class="app-icon">
                    🖼️
                </div>

                <span class="app-name">
                    Gallery
                </span>

            </button>


            <button class="app-button disabled-app">

                <div class="app-icon">
                    📞
                </div>

                <span class="app-name">
                    Calls
                </span>

            </button>


            <button class="app-button disabled-app">

                <div class="app-icon">
                    📝
                </div>

                <span class="app-name">
                    Notes
                </span>

            </button>

        </div>

    </div>


    <!-- =========================
         MESSAGE LIST
    ========================== -->

    <div class="screen messages-screen hidden" id="messagesScreen">

        <div class="messages-header">

            <button class="back-button" id="messagesBackButton">
                ‹
            </button>

            <div>

                <h2>
                    Messages
                </h2>

                <p>
                    Adrien's phone
                </p>

            </div>

        </div>


        <div class="chat-list" id="chatList"></div>

    </div>


    <!-- =========================
         OPEN CONVERSATION
    ========================== -->

    <div class="screen thread-screen hidden" id="threadScreen">

        <div class="thread-header">

            <button class="back-button" id="threadBackButton">
                ‹
            </button>

            <div class="thread-avatar" id="threadAvatar">
                ?
            </div>

            <div class="thread-info">

                <h3 id="threadName">
                    Unknown
                </h3>

                <p id="threadStatus"></p>

            </div>

        </div>


        <div class="thread-body" id="threadBody"></div>


        <!-- ONLY UNKNOWN GETS THIS -->

        <div class="reply-area hidden" id="replyArea">

            <button id="unknownReplyButton">
                Who is this?
            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
</html>
